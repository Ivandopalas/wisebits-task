worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  server_tokens off;

  # $uri rather than $request: story video URLs carry a signed token in the query string.
  log_format main '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                  '$status $body_bytes_sent $request_time "$http_user_agent" $request_id';
  access_log /dev/stdout main;
  error_log /dev/stderr warn;

  # Docker's DNS: `api` resolves to every replica. Re-resolve often: a recreated replica gets a
  # new address, and until nginx notices, requests go to the old one and fail with 502.
  resolver 127.0.0.11 valid=1s ipv6=off;

  # A failed address is skipped for fail_timeout. The default of 10 s keeps a replica that has
  # just come back out of rotation for that long.
  upstream api {
    zone api 64k;
    server api:3000 resolve fail_timeout=3s;
  }

  upstream web {
    zone web 64k;
    server web:3000 resolve fail_timeout=3s;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Shared across both API replicas, unlike the in-process limiter of each instance.
  limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
  limit_conn_zone $binary_remote_addr zone=uploads:10m;

  # Story uploads are capped at 25 MB by the API; leave room for the multipart envelope.
  client_max_body_size 26m;

  # A replica that has just gone away leaves an address that never answers; give up on it fast
  # and try the next one instead of holding the request for the default 60 s.
  proxy_connect_timeout 2s;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Request-Id $request_id;
  proxy_set_header Connection "";

  server {
    listen 80;

    location = /nginx-health {
      access_log off;
      return 200 "ok\n";
    }

    # Socket.io runs websocket-only, so any replica can take any connection: no sticky sessions.
    location /socket.io/ {
      proxy_pass http://api;
      # A location with its own proxy_set_header inherits none from above: repeat them all.
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 75s;
      proxy_send_timeout 75s;
    }

    location ~ ^/api/auth/(login|register)$ {
      limit_req zone=auth burst=20 nodelay;
      limit_req_status 429;
      error_page 429 @too_many_requests;
      error_page 502 @bad_gateway;
      error_page 504 @gateway_timeout;
      proxy_pass http://api;
    }

    # The API reads an upload into memory anyway, so let nginx take the whole body first: a slow
    # client then holds an nginx connection, not an API request. One that stalls is cut off.
    location = /api/stories {
      client_body_timeout 15s;
      limit_conn uploads 4;
      limit_conn_status 429;
      error_page 413 @payload_too_large;
      error_page 429 @too_many_uploads;
      error_page 502 @bad_gateway;
      error_page 504 @gateway_timeout;
      proxy_pass http://api;
    }

    location /api/ {
      error_page 413 @payload_too_large;
      error_page 502 @bad_gateway;
      error_page 504 @gateway_timeout;
      proxy_pass http://api;
      # Stream ranged video straight through.
      proxy_request_buffering off;
      proxy_buffering off;
    }

    # Errors nginx produces on its own, in the API's error format. Error responses from the API
    # pass through untouched (proxy_intercept_errors is off).
    location @too_many_requests {
      default_type application/json;
      return 429 '{"statusCode":429,"error":"Too Many Requests","message":"Too many attempts. Wait a minute and try again.","requestId":"$request_id"}';
    }

    location @too_many_uploads {
      default_type application/json;
      return 429 '{"statusCode":429,"error":"Too Many Requests","message":"Too many uploads at once. Try again when the others finish.","requestId":"$request_id"}';
    }

    location @payload_too_large {
      default_type application/json;
      return 413 '{"statusCode":413,"error":"Payload Too Large","message":"The file is too large.","requestId":"$request_id"}';
    }

    location @bad_gateway {
      default_type application/json;
      return 502 '{"statusCode":502,"error":"Bad Gateway","message":"The server is not available right now. Try again in a moment.","requestId":"$request_id"}';
    }

    location @gateway_timeout {
      default_type application/json;
      return 504 '{"statusCode":504,"error":"Gateway Timeout","message":"The server is not available right now. Try again in a moment.","requestId":"$request_id"}';
    }

    # The API sets these through helmet; the pages come from SvelteKit, which sets only the CSP.
    location / {
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      proxy_pass http://web;
    }
  }
}
