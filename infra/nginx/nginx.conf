worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  server_tokens off;

  # $uri rather than $request: story video URLs carry a signed token in the query string.
  log_format main '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                  '$status $body_bytes_sent $request_time "$http_user_agent" $request_id';
  access_log /dev/stdout main;
  error_log /dev/stderr warn;

  # Docker's DNS: `api` resolves to every replica. Re-resolve often: a recreated replica gets a
  # new address, and until nginx notices, requests go to the old one and fail with 502.
  resolver 127.0.0.11 valid=1s ipv6=off;

  upstream api {
    zone api 64k;
    server api:3000 resolve;
  }

  upstream web {
    zone web 64k;
    server web:3000 resolve;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Shared across both API replicas, unlike the in-process limiter of each instance.
  limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;

  # Story uploads are capped at 25 MB by the API; leave room for the multipart envelope.
  client_max_body_size 26m;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Request-Id $request_id;
  proxy_set_header Connection "";

  server {
    listen 80;

    location = /nginx-health {
      access_log off;
      return 200 "ok\n";
    }

    # Socket.io runs websocket-only, so any replica can take any connection: no sticky sessions.
    location /socket.io/ {
      proxy_pass http://api;
      # A location with its own proxy_set_header inherits none from above: repeat them all.
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 75s;
      proxy_send_timeout 75s;
    }

    location ~ ^/api/auth/(login|register)$ {
      limit_req zone=auth burst=20 nodelay;
      limit_req_status 429;
      proxy_pass http://api;
    }

    location /api/ {
      proxy_pass http://api;
      # Stream uploads and ranged video straight through.
      proxy_request_buffering off;
      proxy_buffering off;
    }

    location / {
      proxy_pass http://web;
    }
  }
}
