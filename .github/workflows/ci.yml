name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Cache MongoDB binaries for the in-memory replica set
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-8.0.34
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end (Docker Compose + Playwright)
    runs-on: ubuntu-24.04
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @chat/web...
      - run: pnpm --filter @chat/web exec playwright install --with-deps chromium firefox
      # The quick start must not need any host port but the app's: hold 27017 the way a local
      # MongoDB would.
      - name: Occupy the MongoDB port
        run: nohup python3 -m http.server 27017 --bind 127.0.0.1 > /dev/null 2>&1 &
      - name: Start the stack
        run: docker compose up -d --build --wait
      - run: pnpm test:e2e
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: docker compose down -v
